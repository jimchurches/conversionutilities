description_rules:
  - match: "^Direct Debit .* COMMSEC SECURITI COMMSEC$"
    template: "Transfer to CommSec"
  - match: "^Direct Credit .* COMMONWEALTH SEC COMMSEC$"
    template: "Transfer from CommSec"
  - match: "^ASIC NetBank BPAY"
    template: "ASIC fee"
  - match: "^TAX OFFICE PAYMENTS"
    template: "PAYG tax payment"
  - match: "^Direct Debit .* IGNITIONPAY"
    template: "Accounting fees"
  - match: "^Transfer To National Audits Group"
    template: "SMSF audit fee"
  - match: "^Transfer To Charles Schwab Co"
    template: "Transfer to Charles Schwab"
  - match: "^Transfer To SUPERCentral"
    template: "Transfer to SUPERCentral"
  - match: "^DEPOSIT CASH"
    template: "Cash deposit"
  - match: "^Direct Credit .* SuperChoice"
    template: "Employer super contribution ({employer_name})"
  - match: "^Direct Credit .* ClickSuper"
    template: "Employer super contribution ({employer_name})"
  - match: "^Direct Credit .* QUICKSUPER"
    template: "Employer super contribution ({employer_name})"
  - match: "^Direct Credit .* PUSHPAY HOLDINGS"
    template: "Income: PPH.ASX dividend"

transaction_templates:
  Credit Interest: "Income: Interest payment"
  Dividend: "Income: {sharesight_code} dividend"
  Interim Dividend: "Income: {sharesight_code} interim dividend"
  Final Dividend: "Income: {sharesight_code} final dividend"
  Scheme Payment: "Income: {sharesight_code} scheme payment"
  Hub24 Distribution: "Income: {sharesight_code} distribution"
  ATO Refund: "ATO refund"

output:
  date_format: d/m/Y
  include_currency_symbol: false
  columns:
    - Date
    - Deposit amount
    - Withdrawal amount
    - Description
