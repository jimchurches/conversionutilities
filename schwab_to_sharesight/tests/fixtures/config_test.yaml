defaults:
  unit_label: shares

smsf:
  member_name: Test Member
  destination_account: Test Super Fund
  contribution_type: Voluntary Contribution

securities:
  LULU:
    sharesight_code: LULU.NASDAQ
    unit_label: shares
  AAPL:
    sharesight_code: APPL.NASDAQ
    unit_label: shares

transaction_templates:
  Sell: "SELL {quantity:g} x {sharesight_code} {unit_label}{assignment_note}"
  Buy: "BUY {quantity:g} x {sharesight_code} {unit_label}{assignment_note}"
  Journaled Shares Deposit: "Non-Concessional Contribution ({member_name}) (In-Specie Transfer {quantity:g} x {sharesight_code}){aud_suffix}"
  Journaled Shares Withdrawal: "BUY {quantity:g} {sharesight_code} {unit_label} (In-Specie Transfer)"
  Journaled Shares Out: "Journaled Shares {quantity:g} x {sharesight_code}: Transfer shares to {destination_account} ( {contribution_type} )"
  Qualified Dividend: "Income: {sharesight_code} qualified dividend"
  NRA Tax Adj: "Foreign Tax (United States NRA Withholding)"
  Margin Interest: "Margin interest"
  Sell to Open: "Options Premium: STO {quantity:g} x {option_contract}"
  Buy to Close: "Options Premium: BTC {quantity:g} x {option_contract}"
  Expired: "Options Expired: {quantity:g} x {option_contract_mapped} ( {position} )"
  Assigned: "Assigned {quantity:g} x {option_contract_mapped} ({position})"
  Wire Sent: "Wire Transfer ([Destination])"
  Wire Fee: "Wire Fee"
  Wire Fee Refund: "Wire Fee Refund"

output:
  date_format: d/m/Y
  include_currency_symbol: false
  columns:
    - Date
    - Deposit amount
    - Withdrawal amount
    - Description
